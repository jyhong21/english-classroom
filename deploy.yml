name: Notion → GitHub Pages 자동 배포

on:
  schedule:
    - cron: '0 * * * *'   # 매 1시간마다 자동 갱신
  push:
    branches: [main]
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: Notion 데이터 가져오기 & 사이트 빌드
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          UNITS_DB_ID: ${{ secrets.UNITS_DB_ID }}
          SCORES_DB_ID: ${{ secrets.SCORES_DB_ID }}
          MATERIALS_DB_ID: ${{ secrets.MATERIALS_DB_ID }}
        run: node build.js

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: '🔄 Notion 데이터 자동 업데이트'
